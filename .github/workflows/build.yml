name: Build Seven Deadly Sins 1.20.1 (Cisco Dragonfyre) JAR

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin for Minecraft 1.20.1)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8 (No wrapper required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Verify pack.mcmeta (pack_format 15) and Compile 1.20.1 Forge JAR
        run: |
          BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Building Seven Deadly Sins 1.20.1 [Dragonfyre Edition] in directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          mkdir -p src/main/resources/META-INF
          rm -f src/main/resources/META-INF/neoforge.mods.toml

          cat << 'EOF' > src/main/resources/pack.mcmeta
          {
            "pack": {
              "description": {
                "text": "Seven Deadly Sins [Dragonfyre RPG] Resources"
              },
              "pack_format": 15
            }
          }
          EOF

          gradle build --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist_jars"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/dist_jars/"
          ls -lh "$GITHUB_WORKSPACE/dist_jars/"

      - name: Upload Compiled 1.20.1 Mod JAR to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sevendeadlysins-1.2.0-forge-1.20.1-dragonfyre-jar
          path: dist_jars/*.jar
          if-no-files-found: error
